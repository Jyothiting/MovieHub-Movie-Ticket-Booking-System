services:

  mysql:
    image: mysql:8.0
    container_name: moviehub-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: moviehub
      MYSQL_USER: movieuser
      MYSQL_PASSWORD: moviepassword

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: moviehub-backend
    restart: unless-stopped

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: moviehub
      DB_USER: movieuser
      DB_PASSWORD: moviepassword

    depends_on:
      mysql:
        condition: service_healthy

    expose:
      - "8000"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: moviehub-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend


volumes:
  mysql_data:
